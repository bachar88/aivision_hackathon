[project]
name = "ai-vision"
version = "0.1.0"
description = "AI Vision Hackathon Project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "torchvision>=0.21.0",
    "timm>=1.0.29",
    "accelerate>=1.15.0",
    "opencv-python-headless>=5.0.0",
    "albumentations>=1.3.0,<1.4.0",
    "scikit-image>=0.26.0",
    "kornia>=0.8.3",
    "ultralytics>=8.4.0",
    "transformers>=5.17.0",
    "datasets>=5.0.1",
    "huggingface-hub>=1.31.0",
    "numpy>=2.4.0",
    "pandas>=3.0.0",
    "scipy>=1.17.0",
    "matplotlib>=3.11.0",
    "seaborn>=0.13.0",
    "plotly>=7.0.0",
    "scikit-learn>=1.9.0",
    "jupyter>=1.1.0",
    "notebook>=7.6.0",
    "ipywidgets>=8.1.0",
    "tqdm>=4.70.0",
    "rich>=15.0.0",
    "python-dotenv>=1.2.0",
    "pyyaml>=6.0.0",
    "omegaconf>=2.3.0",
    "tensorboard>=2.21.0",
    "gradio>=6.27.0",
    "fastapi>=0.141.0",
    "uvicorn>=0.52.0",
    "streamlit>=1.63.0",
    "easyocr>=1.7.0",
    "onnx>=1.22.0",
    "onnxruntime>=1.30.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
